def DEFAULT_COMPILE_SDK_VERSION = 35
def DEFAULT_MIN_SDK_VERSION = 16
def DEFAULT_TARGET_SDK_VERSION = 35

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    // The plugin is supplied by the consuming React Native app. It is only
    // declared here when this Android directory is built on its own.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.7.3'
        }
    }
}

apply plugin: 'com.android.library'

android {
    // AGP 7+ supports namespace. Keep the guard so older RN projects can
    // continue deriving it from AndroidManifest.xml.
    if (project.android.hasProperty('namespace')) {
        namespace 'lm.magneticstripe'
    }
    compileSdkVersion safeExtGet('compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', DEFAULT_MIN_SDK_VERSION)
        targetSdkVersion safeExtGet('targetSdkVersion', DEFAULT_TARGET_SDK_VERSION)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenLocal()
    maven {
        url "$rootDir/../node_modules/react-native/android"
    }
    maven {
        url "$rootDir/../node_modules/jsc-android/dist"
    }
    google()
    mavenCentral()
}

dependencies {
    // React Native is provided by the host application and must not be
    // bundled in this library's AAR.
    compileOnly 'com.facebook.react:react-android:0.76.9'
    implementation files('libs/magnetictrackparser-2.2.3.jar')
    implementation 'us.fatehi:credit_card_number:2.2.3'
}
